<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Time Tracker</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="popup-container">
    <h1>Web Time Tracker</h1>
    <div id="current-website">Loading...</div>
    <div id="time-counter">00:00:00</div>
    <div id="tracking-status" class="tracking-status"><span class="status-dot"></span><span id="status-text">Checking...</span></div>
    <button id="toggle-tracking" class="btn-primary" hidden>Start Tracking</button>
    <div class="secondary-actions">
      <button id="view-analytics" class="btn-secondary">View Analytics</button>
      <button id="open-options" class="btn-secondary">Configure Websites</button>
    </div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
